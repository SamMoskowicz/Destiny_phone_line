services:
  - type: web
    name: destiny-stream-phone-line
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: STREAMER_NAME
        value: Destiny
      - key: KICK_CHANNEL
        value: destiny
      - key: ADMIN_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: AI_SAFETY_SALT
        sync: false
