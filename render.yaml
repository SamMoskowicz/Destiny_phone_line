services:
  - type: web
    name: destiny-stream-phone-line
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: destiny-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STREAMER_NAME
        value: Destiny
      - key: KICK_CHANNEL
        value: destiny
      - key: ADMIN_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_DEEP_VOICE_TIMEOUT_MS
        value: "30000"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: AI_SAFETY_SALT
        generateValue: true
      - key: AI_MEMORY_ENABLED
        value: "true"
      - key: AI_MEMORY_FILE
        value: /var/data/ai-memory.enc.json
      - key: AI_MEMORY_ENCRYPTION_KEY
        generateValue: true
      - key: AI_MEMORY_RECENT_EXCHANGES
        value: "10"
      - key: AI_MEMORY_MAX_PENDING_SUMMARY
        value: "10"
      - key: AI_CONSENT_FILE
        value: /var/data/ai-consent.json
